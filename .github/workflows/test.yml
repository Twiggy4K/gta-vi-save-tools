name: Source-only checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit source-only repository
        run: node scripts/check-repository.cjs
      - name: Run synthetic unit tests
        run: npm test
